<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Cell GHRCEMJ</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SETUP SCREEN -->
  <main id="setup-screen" class="screen active">
    <div class="setup-card">
      <div class="brand-header">
        <img src="logo.png" alt="E-Cell GHRCEMJ Logo" class="brand-logo">
        <h1 class="brand-title">E-CELL GHRCEMJ</h1>
      </div>
      <div class="time-inputs">
        <div class="input-group">
          <label for="hours">HH</label>
          <input type="number" id="hours" min="0" max="99" value="0" autofocus>
        </div>
        <div class="colon">:</div>
        <div class="input-group">
          <label for="minutes">MM</label>
          <input type="number" id="minutes" min="0" max="59" value="0">
        </div>
        <div class="colon">:</div>
        <div class="input-group">
          <label for="seconds">SS</label>
          <input type="number" id="seconds" min="0" max="59" value="0">
        </div>
      </div>
      <button id="start-btn" class="btn-start">Start</button>
    </div>
  </main>

  <!-- RUNNING SCREEN -->
  <main id="running-screen" class="screen">
    <div class="mascot-wrapper">
      <img id="mascot-img" src="lion.png" alt="Lion Mascot">
      <!--
        Single overlay: covers the "00:00:00" digit strip on the
        stopwatch face, sized from pixel analysis of the new image.
        No KIMBA cover needed — the new image has no KIMBA text.
      -->
      <div class="timer-overlay">
        <span id="timer-display">00:00:00</span>
      </div>
    </div>

    <div class="control-bar">
      <button id="stop-btn" class="btn-stop">Stop</button>
      <button id="back-btn" class="btn-back">Back</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
